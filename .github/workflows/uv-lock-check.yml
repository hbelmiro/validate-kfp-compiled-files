name: uv-lock-check

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  uv-lock-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      - name: Check lock file
        uses: hbelmiro/uv-lock-check@b00eda7957c0ae48b5a1106ba19f3dc01b5888d5 # v0.4.0
        with:
          show-diff: 'true'

      - name: Check integration requirements sync
        uses: hbelmiro/uv-lock-check@b00eda7957c0ae48b5a1106ba19f3dc01b5888d5 # v0.4.0
        with:
          command: uv export --package integration-env --format requirements-txt --no-emit-project -o tests/integration/requirements.txt
          show-diff: 'true'
